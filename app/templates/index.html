<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitika | Personal Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .profile-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            margin-top: 20px;
            color: #333;
        }

        .subtitle {
            color: #777;
            margin: 12px 0 25px;
            line-height: 1.6;
        }

        .email {
            color: #555;
            margin-bottom: 25px;
        }

        .social-links a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 13px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .hashnode {
            background: #2962ff;
        }

        .github {
            background: #24292e;
        }

        .linkedin {
            background: #0077b5;
        }

        .social-links a:hover {
            transform: translateY(-3px);
            opacity: 0.85;
        }

        footer {
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <div class="profile-icon">N</div>

        <h1>Hi, I'm Nitika!</h1>

        <p class="subtitle">
            Welcome to my personal website.
            I love learning new technologies and building things.
        </p>

        <p class="email">
            📧 rawatnitika797@gmail.com
        </p>

        <div class="social-links">

            <a class="hashnode" href="hashnode.com/@nitikablogs">
                Hashnode
            </a>

            <a class="github" href="https://github.com/nitikarawat82">
                GitHub
            </a>

            <a class="linkedin" href="https://www.linkedin.com/in/nitika-rawat-901543226/">
                LinkedIn
            </a>

        </div>

        <footer>
            © 2026 Nitika | Built with HTML & CSS
        </footer>

    </div>

</body>
</html>
